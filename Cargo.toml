[workspace]
resolver = "2"
members = ["crates/plan-core", "crates/plan-wasm", "server"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
ts-rs = { version = "12", features = ["uuid-impl", "serde-json-impl"] }

[profile.release]
lto = "thin"
